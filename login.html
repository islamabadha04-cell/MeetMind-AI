<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to MeetMind AI (2026) — Your Intelligent Meeting Assistant.">
  <meta name="theme-color" content="#6366F1">
  <title>Sign In — MeetMind AI</title>

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  
  <style>
    :root {
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --bg-dark: #0B0F19;
      --bg-card: #111827;
      --border-color: rgba(255, 255, 255, 0.09);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --radius-md: 10px;
      --radius-lg: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(124, 58, 237, 0.05) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border-color);
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .auth-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .auth-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .auth-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    .btn-google {
      width: 100%;
      background: #ffffff;
      color: #0F172A;
      border: 1px solid #E2E8F0;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 20px 0 16px;
      transition: all 0.2s ease;
    }

    .btn-google:hover {
      background: #F8FAFC;
      transform: translateY(-1px);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 16px 0;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .auth-divider span {
      padding: 0 12px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .auth-input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .auth-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-demo-guest {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 11px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      transition: all 0.2s ease;
    }

    .btn-demo-guest:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
    }

    .auth-switch {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 20px;
    }

    .auth-switch a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    .auth-footer {
      position: relative;
      z-index: 10;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      gap: 16px;
    }

    .auth-footer a {
      color: var(--text-dim);
      text-decoration: none;
    }

    .auth-footer a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo"><i class="ri-voiceprint-fill"></i></div>
      <div>
        <h2 style="font-size: 17px; font-weight: 800;">MeetMind AI</h2>
        <span style="font-size: 11px; color: var(--text-dim);">Enterprise Intelligent Workspace</span>
      </div>
    </div>

    <h1 class="auth-title" id="formTitle">Sign in to your account</h1>
    <p class="auth-sub" id="formSub">Access your private meetings, automated action items, and AI insights.</p>

    <!-- Google One-Click Sign In -->
    <button class="btn-google" id="btnGoogleAuth">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.01 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider">
      <span>or sign in with email</span>
    </div>

    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="input-group">
        <label class="input-label">Email address</label>
        <input type="email" id="authEmail" required placeholder="you@company.com" class="auth-input">
      </div>

      <div class="input-group">
        <label class="input-label">Password</label>
        <input type="password" id="authPassword" required placeholder="••••••••" class="auth-input">
      </div>

      <button type="submit" class="btn-submit" id="btnSubmitForm">Sign In to Dashboard &rarr;</button>
    </form>

    <!-- Instant Guest Access for Evaluators / Recruiter -->
    <button class="btn-demo-guest" id="btnGuestAccess">
      <i class="ri-user-smile-line"></i> Continue as Demo Guest (Instant Access)
    </button>

    <div class="auth-switch">
      <span id="switchPrompt">Don't have an account?</span>
      <a href="#" id="switchModeBtn">Create one free</a>
    </div>
  </div>

  <div class="auth-footer">
    <a href="/">&larr; Back to Home</a>
    <span>•</span>
    <a href="/privacy.html">Privacy Policy</a>
    <span>•</span>
    <a href="/terms.html">Terms of Service</a>
  </div>

  <script type="module">
    import { auth, googleProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword } from './firebase-service.js';

    let isSignUp = false;

    // Switch between Sign in and Sign up
    const switchModeBtn = document.getElementById('switchModeBtn');
    const formTitle = document.getElementById('formTitle');
    const formSub = document.getElementById('formSub');
    const btnSubmitForm = document.getElementById('btnSubmitForm');
    const switchPrompt = document.getElementById('switchPrompt');

    if (switchModeBtn) {
      switchModeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        isSignUp = !isSignUp;
        if (isSignUp) {
          formTitle.textContent = 'Create your account';
          formSub.textContent = 'Get 120 free minutes of AI transcription and meeting summaries every month.';
          btnSubmitForm.textContent = 'Create Free Account →';
          switchPrompt.textContent = 'Already have an account?';
          switchModeBtn.textContent = 'Sign in';
        } else {
          formTitle.textContent = 'Sign in to your account';
          formSub.textContent = 'Access your private meetings, automated action items, and AI insights.';
          btnSubmitForm.textContent = 'Sign In to Dashboard →';
          switchPrompt.textContent = "Don't have an account?";
          switchModeBtn.textContent = 'Create one free';
        }
      });
    }

    // Google Sign In
    const btnGoogleAuth = document.getElementById('btnGoogleAuth');
    if (btnGoogleAuth) {
      btnGoogleAuth.addEventListener('click', async () => {
        try {
          btnGoogleAuth.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Connecting Google...';
          const res = await signInWithPopup(auth, googleProvider);
          if (res && res.user) {
            const userObj = {
              name: res.user.displayName || res.user.email.split('@')[0],
              email: res.user.email,
              uid: res.user.uid,
              photo: res.user.photoURL || ''
            };
            localStorage.setItem('meetmind_user', JSON.stringify(userObj));
            window.location.href = '/app';
          }
        } catch (err) {
          console.warn('Google Auth note:', err);
          btnGoogleAuth.innerHTML = '<i class="ri-google-fill"></i> Continue with Google';
          alert('Google Sign-In notice: ' + (err.message || 'Please check your connection or continue with email/demo.'));
        }
      });
    }

    // Email / Password Submit
    window.handleAuthSubmit = async function(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPassword').value;
      const submitBtn = document.getElementById('btnSubmitForm');
      const originalText = submitBtn.textContent;

      try {
        submitBtn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Authenticating...';
        let userCredential;
        if (isSignUp) {
          userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        } else {
          userCredential = await signInWithEmailAndPassword(auth, email, pass);
        }
        
        const user = userCredential.user;
        const userObj = {
          name: email.split('@')[0],
          email: user.email,
          uid: user.uid
        };
        localStorage.setItem('meetmind_user', JSON.stringify(userObj));
        window.location.href = '/app';
      } catch (err) {
        console.warn('Auth notice:', err.message);
        submitBtn.textContent = originalText;
        alert((isSignUp ? 'Registration note: ' : 'Sign in note: ') + err.message);
      }
    };

    // Guest demo access (Instant evaluation for reviewers)
    const btnGuestAccess = document.getElementById('btnGuestAccess');
    if (btnGuestAccess) {
      btnGuestAccess.addEventListener('click', () => {
        localStorage.setItem('meetmind_user', JSON.stringify({ 
          name: 'Demo Reviewer', 
          email: 'demo@meetmind.ai', 
          uid: 'demo_guest_evaluator',
          isGuest: true 
        }));
        window.location.href = '/app';
      });
    }
  </script>
</body>
</html>
